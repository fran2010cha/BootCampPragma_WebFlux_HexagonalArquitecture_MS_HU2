server:
  port: 8080
spring:
  application:
    name: "CrediYa_MS_HU2"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediyaHU2"
    schema: "public"
    username: "postgres"
    password: "admin123"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    solicitudes: "/api/v1/solicitud"
    solicitudById: "/api/v1/solicitud/{id}"

